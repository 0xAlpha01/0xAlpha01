<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Alpha01 — Backend Engineer and Full-Stack Developer</title>
  <desc id="desc">A technical dark interface with a cyan wireframe sphere, orbital geometry, a subtle grid, and a terminal detail.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9BB5C5" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="sphereClip">
      <circle cx="914" cy="210" r="137"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="14" fill="#070A0E"/>
  <rect width="1200" height="430" rx="14" fill="url(#grid)"/>
  <path d="M0 350H1200M0 382H1200" stroke="#9BB5C5" stroke-opacity=".12"/>
  <path d="M48 54H1152" stroke="#9BB5C5" stroke-opacity=".2"/>
  <circle cx="48" cy="54" r="3" fill="#39C5F3"/>
  <text x="64" y="59" fill="#A9B8C4" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.5">ALPHA SYSTEMS / PROFILE 01</text>
  <text x="1152" y="59" text-anchor="end" fill="#718391" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">ONLINE · 0x01</text>

  <text x="76" y="163" fill="#39C5F3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2">BACKEND ENGINEER · FULL-STACK DEVELOPER</text>
  <text x="70" y="254" fill="#F2F6F8" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" letter-spacing="-5">Alpha01</text>
  <path d="M78 278H404" stroke="#39C5F3" stroke-width="2"/>
  <text x="78" y="310" fill="#9AABB9" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing=".4">Designing dependable systems.</text>
  <text x="78" y="333" fill="#9AABB9" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing=".4">Building useful things for the web.</text>

  <rect x="78" y="363" width="378" height="42" rx="5" fill="#0B1117" stroke="#24323D"/>
  <circle cx="96" cy="384" r="3" fill="#39C5F3"/>
  <text x="110" y="389" fill="#A9B8C4" font-family="Consolas, Menlo, monospace" font-size="12">
    <tspan fill="#39C5F3">&gt;</tspan><tspan> go run ./services/api</tspan>
  </text>
  <text x="430" y="389" fill="#39C5F3" font-family="Consolas, Menlo, monospace" font-size="13">
    <tspan>_</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <g opacity=".8">
    <circle cx="914" cy="210" r="137" stroke="#39C5F3" stroke-opacity=".45" stroke-width="1.2"/>
    <g clip-path="url(#sphereClip)" stroke="#64D7F7" stroke-opacity=".46" stroke-width="1">
      <ellipse cx="914" cy="210" rx="137" ry="28"/>
      <ellipse cx="914" cy="210" rx="137" ry="62"/>
      <ellipse cx="914" cy="210" rx="137" ry="98"/>
      <ellipse cx="914" cy="210" rx="137" ry="132"/>
      <ellipse cx="914" cy="210" rx="34" ry="137"/>
      <ellipse cx="914" cy="210" rx="70" ry="137"/>
      <ellipse cx="914" cy="210" rx="104" ry="137"/>
      <ellipse cx="914" cy="210" rx="129" ry="137"/>
      <path d="M765 104L1063 316M772 297L1056 112M914 72V348M777 210H1051" stroke="#39C5F3" stroke-opacity=".23"/>
    </g>
    <circle cx="914" cy="210" r="4" fill="#B5F1FF" filter="url(#softGlow)"/>
  </g>

  <g stroke="#39C5F3" stroke-opacity=".52">
    <ellipse cx="914" cy="210" rx="188" ry="66" transform="rotate(-27 914 210)"/>
    <ellipse cx="914" cy="210" rx="168" ry="88" transform="rotate(58 914 210)" stroke-opacity=".25"/>
  </g>
  <g>
    <circle cx="749" cy="138" r="3" fill="#B5F1FF" filter="url(#softGlow)"/>
    <circle cx="1073" cy="262" r="2.5" fill="#39C5F3"/>
    <circle cx="1007" cy="83" r="2" fill="#A9B8C4"/>
    <circle cx="815" cy="350" r="2" fill="#A9B8C4"/>
    <circle cx="1096" cy="129" r="1.5" fill="#39C5F3"/>
    <circle cx="729" cy="263" r="1.5" fill="#A9B8C4"/>
  </g>
  <g fill="#A9B8C4" font-family="Consolas, Menlo, monospace" font-size="9" letter-spacing="1.4">
    <text x="1092" y="183">01 / API</text>
    <text x="1092" y="199">02 / DATA</text>
    <text x="1092" y="215">03 / SCALE</text>
  </g>
  <path d="M1082 177V222" stroke="#39C5F3" stroke-opacity=".6"/>

  <g fill="#718391" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">
    <text x="48" y="414">ENGINEERING · SYSTEMS · SOFTWARE</text>
    <text x="1152" y="414" text-anchor="end">EST. / ALWAYS BUILDING</text>
  </g>
  <circle cx="1105" cy="54" r="1.5" fill="#39C5F3"/>
  <circle cx="1123" cy="54" r="1.5" fill="#39C5F3" opacity=".55"/>
  <circle cx="1141" cy="54" r="1.5" fill="#39C5F3" opacity=".25"/>
  <g opacity=".7">
    <path d="M914 22V47" stroke="#39C5F3" stroke-opacity=".45"/>
    <circle cx="914" cy="18" r="2" fill="#39C5F3">
      <animateTransform attributeName="transform" type="rotate" from="0 914 210" to="360 914 210" dur="34s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
